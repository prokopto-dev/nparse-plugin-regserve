# CI answers one question: is this diff correct?
#
# Every step shells out to a `make` target, so what CI runs and what you run locally cannot drift.
# Actions are pinned to 40-character SHAs with the version in a trailing comment; PIN001 in
# scripts/repo-gates.sh fails any bare-tag `uses:`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs. NEVER cancel main, a tag, or a merge_group — a cancelled
  # merge-queue run wedges the queue.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never silently download a different compiler than go.mod pins.
  GOTOOLCHAIN: local

jobs:
  repo:
    name: lint / repo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Repository gates
        run: make lint-repo
      - name: Documentation gates
        run: make docs-check
      - name: Every command in the docs resolves
        run: make verify-commands

  go:
    name: build / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: false
      - run: make vet
      - run: make build
      - run: make test

  # GEN001 — checked-in generated code matches its source (issue #12).
  #
  # Its own job because it needs sqlc and Atlas, and `make check` has to stay runnable on a machine
  # with neither: a gate that quietly skips when its toolchain is absent is a gate that reports
  # success for a regeneration that never happened. The `go` job stays fast and toolchain-free.
  #
  # `make tools` installs the versions the Makefile pins, so the generator CI regenerates with and
  # the one that produced the checked-in code cannot be different.
  generated:
    name: check / generated
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: false
      - run: make tools
      - run: make gen-check

  golangci:
    name: lint / go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2

  # A single required check, so branch protection names one job rather than a list that drifts
  # every time a job is added.
  ci-required:
    name: ci-required
    runs-on: ubuntu-24.04
    needs: [repo, go, generated, golangci]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        # Through `env:`, not interpolated into the script. Gate ACT001 requires it of every
        # workflow in this repository: an expression written into a shell script is EXECUTED by
        # that shell, and the rule is only checkable if it has no exceptions — including the ones,
        # like this boolean, that are obviously safe today.
        env:
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "a required job failed"; exit 1
          fi
          echo "all required jobs succeeded"
