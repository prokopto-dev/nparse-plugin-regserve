# Deploy to the DigitalOcean droplet.
#
# Split from release.yml on purpose: building an image is safe and automatic, applying it to the
# machine holding the only copy of the ownership records is neither. This workflow needs an
# environment approval on production and takes a snapshot before it swaps anything.
#
# What actually happens on the host is `docker compose pull && up -d`. Traefik already owns :443 and
# picks the new container up from its labels, so there is no reverse-proxy step here.
#
# The catalogue itself is NOT shipped by this workflow. Until the store lands (Phase 1) it is
# /opt/regserve/seed.json on the droplet, mounted into the container; this workflow asserts it is
# there before it touches anything.

name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 1.2.0, edge, sha-<full>)"
        required: true
        default: edge

permissions:
  contents: read

concurrency:
  # Never deploy twice at once: two `compose up` runs against one SQLite volume is exactly the
  # situation the single-writer design assumes cannot happen.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy / production
    runs-on: ubuntu-24.04

    # Requires the `production` environment. Put a required reviewer on it in repo settings: that
    # is what makes a deploy a decision rather than a side effect of merging.
    environment:
      name: production
      url: https://${{ vars.REGSERVE_HOST }}

    # Do not deploy a build that failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve the image reference
        id: image
        run: |
          tag="${{ github.event.inputs.image_tag }}"
          [ -n "$tag" ] || tag="sha-${{ github.event.workflow_run.head_sha }}"
          echo "ref=ghcr.io/${{ github.repository }}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinned host key, NOT ssh-keyscan. Scanning at deploy time trusts whatever answers, which
      # means a deploy is the one moment an attacker gets a free man-in-the-middle.
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          # A repository VARIABLE, not a secret. The hostname is in deploy/env.example, in the
          # deployment runbook and in public DNS, so secrecy bought nothing — while the log
          # masking that comes with a secret turned "the name does not resolve" into
          # `ssh: Could not resolve hostname ***` and cost four failed deploys. One name is used
          # for SSH and for HTTPS, so this is also the string DEPLOY_KNOWN_HOSTS must be
          # keyscanned against. The credential and the host-key pin stay secrets.
          HOST: ${{ vars.REGSERVE_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # QUOTED heredoc, and values cross the wire as positional arguments to `bash -s`.
          # An unquoted heredoc expands on the RUNNER, so a variable meant for the droplet gets
          # eaten by the runner's own `set -u` before the script is ever sent. That is not a
          # theoretical risk: it is what broke the first deploy, on `stamp`.
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            bash -seuo pipefail -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'REMOTE'
          deploy_path="$1"
          image_ref="$2"
          cd "$deploy_path"

          # Preflight, BEFORE anything is pulled or swapped.
          #
          # The catalogue is a file placed by hand on this box (docs/operations/deployment.md), so
          # CI never sees it and cannot fail on it any earlier than this. The container is started
          # with --seed, which means a missing or empty file is a boot failure — and discovering
          # that after `compose up` means discovering it with the old container already gone. This
          # is the same argument as the snapshot below, one step further back.
          #
          # Non-empty is as far as a shell check honestly goes; whether the JSON parses is asserted
          # by the verify step at the end, and by the server itself refusing to start.
          if [ ! -s seed.json ]; then
            echo "FATAL: ${deploy_path}/seed.json is missing or empty." >&2
            echo "It is the catalogue this release serves. See docs/operations/deployment.md." >&2
            exit 1
          fi
          echo "seed.json present ($(wc -c < seed.json) bytes)"

          # Snapshot before anything changes. Migrations are forward-only (ADR-0006), so this file
          # is the only undo that exists. Taking it after the pull would be taking it after the
          # point of no return.
          mkdir -p backups
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if docker volume inspect regserve_regserve-data >/dev/null 2>&1; then
            docker run --rm \
              -v regserve_regserve-data:/data \
              -v "$PWD/backups:/backups" \
              alpine:3 sh -c 'cp /data/regserve.db "/backups/pre-'"$stamp"'.db" 2>/dev/null' \
              || echo "no database file yet; nothing to snapshot"
          else
            echo "no data volume yet; first deploy"
          fi
          ls -1t backups/ 2>/dev/null | tail -n +11 | while read -r old; do rm -f -- "backups/$old"; done

          # Pin the exact image, so a manual `docker compose up` on the box brings up what CI last
          # shipped rather than whatever :latest has become.
          sed -i "s|^REGSERVE_IMAGE=.*|REGSERVE_IMAGE=${image_ref}|" .env
          grep '^REGSERVE_IMAGE=' .env

          docker compose pull regserve
          docker compose up -d --remove-orphans regserve
          docker image prune -f --filter "until=168h"
          docker compose ps
          REMOTE

      - name: Verify the deployment is actually serving
        env:
          HOST_URL: https://${{ vars.REGSERVE_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "${HOST_URL}/healthz" >/dev/null; then
              echo "healthz is answering"
              break
            fi
            [ "$i" -eq 30 ] && { echo "healthz never came up"; exit 1; }
            sleep 5
          done

          # Readiness, which for now means "a catalogue is loaded and still renders". It answers
          # before /index.json is fetched because it says WHY when it is not ready, and a 503 with
          # a reason is a better first line in a failed deploy's log than a curl exit code.
          curl -fsS --max-time 15 "${HOST_URL}/readyz"

          # The point of the whole service: the index must be servable and parseable. A deploy that
          # boots but serves a broken index is a deploy that took every client's plugin browser
          # down, so this failing is a real failure.
          curl -fsS --max-time 15 "${HOST_URL}/index.json" -o /tmp/index.json
          python3 -c "
          import json,sys
          d=json.load(open('/tmp/index.json'))
          assert d['schema_version'] == 1, f\"schema_version is {d['schema_version']}, not 1\"
          assert isinstance(d['plugins'], list), 'plugins must be a list'
          print(f\"index ok: {len(d['plugins'])} plugin(s), schema_version={d['schema_version']}\")
          "
