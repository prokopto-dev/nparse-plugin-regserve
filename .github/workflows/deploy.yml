# Deploy to the DigitalOcean droplet.
#
# Split from release.yml on purpose: building an image is safe and automatic, applying it to the
# machine holding the only copy of the ownership records is neither. This workflow needs an
# environment approval on production and takes a snapshot before it swaps anything.
#
# What actually happens on the host is `docker compose pull && up -d`, against the compose file this
# workflow ships alongside the image. Traefik already owns :443 and picks the new container up from
# its labels, so there is no reverse-proxy step here.
#
# The split of what travels and what stays: the IMAGE and the COMPOSE FILE come from the release —
# from the SAME COMMIT, which is why this workflow checks out the triggering release rather than
# whatever the default branch has become while the deploy waited for approval. The `.env` stays on the
# droplet, because it holds secrets and a secret routed through a pipeline is a secret in that
# pipeline's logs, cache and every fork's pull-request context.
#
# The catalogue itself is NOT shipped by this workflow. Until the store lands (Phase 1) it is
# /opt/regserve/seed.json on the droplet, mounted into the container; this workflow asserts it is
# there before it touches anything.

name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 1.2.0, edge, sha-<full>)"
        required: true
        default: edge
      source_ref:
        description: >-
          Commit or tag the image was built from. The compose file is taken from here, so it must
          match image_tag: sha-<full> -> <full>, 1.2.0 -> v1.2.0. `edge` is built from the tip of
          main, which moves — prefer sha-<full> for anything you care about being reproducible.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  # Never deploy twice at once: two `compose up` runs against one SQLite volume is exactly the
  # situation the single-writer design assumes cannot happen.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy / production
    runs-on: ubuntu-24.04

    # Requires the `production` environment. Put a required reviewer on it in repo settings: that
    # is what makes a deploy a decision rather than a side effect of merging.
    environment:
      name: production
      url: https://${{ vars.REGSERVE_HOST }}

    # Do not deploy a build that failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # Resolved BEFORE the checkout, because it decides what the checkout takes.
      #
      # The image and the compose file must come from ONE commit. A deploy waits for a human on the
      # production environment, and `main` keeps moving while it waits — so checking out the default
      # branch would stage a compose file from a release this image was never built for. It would
      # not even look wrong: the run is green, the image is the pinned one, and the container comes
      # up with flags, mounts or required variables from somewhere else entirely.
      #
      # Values are passed through `env:` rather than interpolated into the script, so a crafted
      # dispatch input is data and never a line of shell.
      - name: Resolve the image and the commit it was built from
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_REF: ${{ github.event.inputs.source_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            # The release that triggered this run. One commit, both values.
            tag="sha-${RUN_SHA}"
            ref="$RUN_SHA"
          else
            tag="$INPUT_TAG"
            ref="$INPUT_REF"
          fi
          [ -n "$tag" ] || { echo "FATAL: image_tag is empty." >&2; exit 1; }
          [ -n "$ref" ] || { echo "FATAL: source_ref is empty." >&2; exit 1; }

          # Reject these values, do not encode them.
          #
          # $GITHUB_OUTPUT is a line-oriented `name=value` file, so a value containing a newline is
          # not an odd value — it is extra RECORDS. An image_tag of
          # "edge<newline>image=ghcr.io/attacker/evil:x" appends a second `image=` line, the LAST
          # one wins, and the deploy pulls and starts whatever it names, on production, past the
          # environment approval that was meant to be the control.
          #
          # The delimiter form would stop the injection and then hand `docker pull` a two-line image
          # reference instead, which is not an improvement. Neither of these is ever anything but a
          # plain token, so the honest answer is to refuse.
          #
          # `case`, not `grep`: grep is LINE-oriented, so `grep -E '^[A-Za-z0-9._-]+$'` matches the
          # first line of a multiline value and waves this exact attack through. A shell pattern
          # tests the whole string, newline included.
          case "$tag" in
            -* | *[!A-Za-z0-9._-]*)
              echo "FATAL: image_tag must be an OCI tag: letters, digits, '.', '_', '-'." >&2
              exit 1 ;;
          esac
          # `..` is not legal in a git ref, and a leading dash would be read as an option by the
          # commands these values reach.
          case "$ref" in
            -* | *..* | *[!A-Za-z0-9._/-]*)
              echo "FATAL: source_ref must be a commit sha, tag or branch name." >&2
              exit 1 ;;
          esac
          [ "${#tag}" -le 128 ] || { echo "FATAL: image_tag exceeds 128 characters." >&2; exit 1; }
          [ "${#ref}" -le 255 ] || { echo "FATAL: source_ref exceeds 255 characters." >&2; exit 1; }

          {
            echo "tag=${tag}"
            echo "source_ref=${ref}"
            echo "image=ghcr.io/${REPO}:${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "deploying ${tag} from ${ref}"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      # Prove the pairing where it is provable. A `sha-<full>` tag names its own commit, so a
      # mismatch here means the source ref was wrong and the compose file about to be shipped
      # belongs to a different release. A moving tag like `edge` cannot be checked, and this says so
      # rather than implying a guarantee it has not made.
      - name: Assert the compose file and the image come from one commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$TAG" in
            sha-*)
              want="${TAG#sha-}"
              if [ "$want" != "$head" ]; then
                echo "FATAL: image was built from ${want} but compose.yaml would come from ${head}." >&2
                echo "Re-run with source_ref=${want}." >&2
                exit 1
              fi
              echo "image and compose.yaml are both from ${head}"
              ;;
            *)
              echo "NOTE: ${TAG} is not a commit-derived tag, so the pairing cannot be verified."
              echo "compose.yaml comes from ${head}"
              ;;
          esac

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinned host key, NOT ssh-keyscan. Scanning at deploy time trusts whatever answers, which
      # means a deploy is the one moment an attacker gets a free man-in-the-middle.
      - name: Pin the host key
        # The value arrives through `env:` rather than being interpolated into the script (gate
        # ACT001). It matters most here of anywhere in this file: an expression written into a
        # shell script is executed by that shell, and this one is a repository secret.
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Staged as a separate file, not written over the live one. Nothing on the droplet changes
      # until the heredoc below has validated it against the host's real .env.
      - name: Stage the compose file
        env:
          HOST: ${{ vars.REGSERVE_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes deploy/compose.yaml \
            "${USER_NAME}@${HOST}:${DEPLOY_PATH}/compose.yaml.incoming"

      - name: Deploy
        env:
          # A repository VARIABLE, not a secret. The hostname is in deploy/env.example, in the
          # deployment runbook and in public DNS, so secrecy bought nothing — while the log
          # masking that comes with a secret turned "the name does not resolve" into
          # `ssh: Could not resolve hostname ***` and cost four failed deploys. One name is used
          # for SSH and for HTTPS, so this is also the string DEPLOY_KNOWN_HOSTS must be
          # keyscanned against. The credential and the host-key pin stay secrets.
          HOST: ${{ vars.REGSERVE_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          # QUOTED heredoc, and values cross the wire as positional arguments to `bash -s`.
          # An unquoted heredoc expands on the RUNNER, so a variable meant for the droplet gets
          # eaten by the runner's own `set -u` before the script is ever sent. That is not a
          # theoretical risk: it is what broke the first deploy, on `stamp`.
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            bash -seuo pipefail -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'REMOTE'
          deploy_path="$1"
          image_ref="$2"
          cd "$deploy_path"

          # Adopt the compose file that shipped with this release, BEFORE anything is pulled.
          #
          # It used to be hand-copied once at setup and never again, so a release could add a flag
          # the running stack never picked up. That is not hypothetical: the release that added
          # `--seed` would have started against a compose file that knew nothing about it, and the
          # container would have come up with no catalogue while /healthz reported "ok".
          if [ ! -s compose.yaml.incoming ]; then
            echo "FATAL: compose.yaml.incoming did not arrive; the staging step should have sent it." >&2
            exit 1
          fi

          # Validate the INCOMING file against this host's real .env. `config` resolves every
          # interpolation, so it fails here on a malformed compose file AND on any ${VAR:?} the .env
          # is missing — both of which would otherwise surface during `up -d`, with the old
          # container already stopped.
          docker compose -f compose.yaml.incoming --env-file .env config -q

          if [ -f compose.yaml ]; then
            cp compose.yaml compose.yaml.prev
          fi
          # `cat >`, not `mv`: writing through the existing file keeps its owner and mode, which a
          # rename from a scp-created file would silently replace.
          cat compose.yaml.incoming > compose.yaml
          rm -f compose.yaml.incoming
          echo "compose.yaml is the one that shipped with this release"

          # Preflight, BEFORE anything is pulled or swapped.
          #
          # The catalogue is a file placed by hand on this box (docs/operations/deployment.md), so
          # CI never sees it and cannot fail on it any earlier than this. The container is started
          # with --seed, which means a missing or empty file is a boot failure — and discovering
          # that after `compose up` means discovering it with the old container already gone. This
          # is the same argument as the snapshot below, one step further back.
          #
          # Non-empty is as far as a shell check honestly goes; whether the JSON parses is asserted
          # by the verify step at the end, and by the server itself refusing to start.
          if [ ! -s seed.json ]; then
            echo "FATAL: ${deploy_path}/seed.json is missing or empty." >&2
            echo "It is the catalogue this release serves. See docs/operations/deployment.md." >&2
            exit 1
          fi
          echo "seed.json present ($(wc -c < seed.json) bytes)"

          # Snapshot before anything changes. Migrations are forward-only (ADR-0006), so this file
          # is the only undo that exists. Taking it after the pull would be taking it after the
          # point of no return.
          #
          # VACUUM INTO, NOT `cp`. The store opens SQLite in WAL mode with synchronous=NORMAL
          # (internal/store/store.go), so a committed transaction lives in `regserve.db-wal` until
          # something checkpoints it. Copying the main file alone out of a RUNNING container omits
          # every commit still in the WAL -- a release published minutes ago, an id just claimed, a
          # token just minted -- and says nothing about having done so. A backup quietly missing the
          # newest writes is worse than no backup, because it is the one that gets trusted on the
          # day it matters. internal/store/storetest says the same thing from the other side:
          # "closing is what checkpoints the WAL into the file being copied".
          #
          # Why VACUUM INTO and not the alternatives:
          #   - It reads ONE consistent snapshot inside a read transaction. Writers carry on; what
          #     lands is the database as of the instant it began, WAL frames included.
          #   - `.backup` (sqlite3_backup) copies page by page and RESTARTS from the beginning
          #     whenever the source is written to, so against a live service it can spin, and the
          #     CLI can give up with SQLITE_BUSY. A backup that sometimes does not finish is a
          #     different failure, not a smaller one.
          #   - Copying db + -wal + -shm with `cp` is three reads of a moving target. It is
          #     consistent only if nothing commits between them, which is the assumption that put
          #     this comment here in the first place.
          #   - It reads every page through the b-tree, so a corrupt database FAILS the backup
          #     rather than producing a corrupt copy that looks fine until it is restored.
          #
          # THE COST, STATED: the output is a fresh, defragmented database rather than a byte copy,
          # so its size will not match the source -- which is why the check below is "non-empty and
          # passes integrity_check" and not a size comparison. And `apk add sqlite` means this step
          # now needs the package mirror; a deploy fails if it cannot reach it, which is the correct
          # direction for the only undo there is.
          mkdir -p backups
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          snapshot="backups/pre-${stamp}.db"
          rm -f backups/.snapshot.tmp backups/.integrity

          # BOTH PROBES ANSWER POSITIVELY OR STOP THE DEPLOY. A probe read as a boolean fails open:
          # `docker volume inspect` exits non-zero for a volume that is absent AND for a daemon that
          # is not answering, and `test -f` inside a container exits non-zero for a missing file AND
          # for an image that would not pull, a mount that failed, or a permission problem. Read as
          # "no database, carry on", every one of those walks into the migration with no snapshot --
          # which is the same fail-open shape as the `|| echo` this block is replacing, one level up.
          #
          # So: `volume ls` exits 0 whether or not it matches and its OUTPUT is the answer, and the
          # database probe prints one of two words and exits 0 for both. Anything else is a failure
          # to establish the fact, and a fact we could not establish is never "nothing to back up".
          if ! volume="$(docker volume ls --quiet --filter 'name=^regserve_regserve-data$')"; then
            echo "FATAL: could not list docker volumes, so it is unknown whether there is a" >&2
            echo "database to snapshot. Nothing has been changed yet." >&2
            exit 1
          fi

          probe=ABSENT
          if [ -n "$volume" ]; then
            if ! probe="$(docker run --rm -v regserve_regserve-data:/data alpine:3 \
                   sh -euc 'if [ -f /data/regserve.db ]; then echo PRESENT; else echo ABSENT; fi')"; then
              echo "FATAL: could not probe the data volume for a database, so it is unknown" >&2
              echo "whether there is one to snapshot. Nothing has been changed yet." >&2
              exit 1
            fi
          fi

          if [ -z "$volume" ]; then
            # First deploy on this droplet. One of exactly TWO branches that may continue without a
            # snapshot, and it is reached only because `volume ls` succeeded and said so.
            echo "no data volume yet; first deploy, nothing to snapshot"
          elif [ "$probe" = ABSENT ]; then
            # The volume is there and holds no database: a first boot that has not happened yet.
            # The other branch that may continue, for the same reason -- the probe answered.
            echo "no database in the volume yet; nothing to snapshot"
          elif [ "$probe" != PRESENT ]; then
            echo "FATAL: the database probe answered '$probe', which is neither PRESENT nor" >&2
            echo "ABSENT. Nothing has been changed yet." >&2
            exit 1
          else
            # NO `2>/dev/null` and NO `|| echo`. The previous version printed "no database file
            # yet; nothing to snapshot" for a permission error, a full disk and an sqlite failure
            # alike, and then walked into the migration. Every failure from here has to stop the
            # deploy, because the next lines are the point of no return.
            #
            # The snapshot is written to a DOT-file and only renamed once it has been checked, so a
            # half-written file can never sit in backups/ under a name that looks like a good one.
            # Dot-files are also invisible to the rotation below, which lists only `pre-*.db`.
            docker run --rm \
              -v regserve_regserve-data:/data \
              -v "$PWD/backups:/backups" \
              alpine:3 sh -euc "
                apk add --no-cache sqlite >/dev/null
                sqlite3 -bail /data/regserve.db \"VACUUM INTO '/backups/.snapshot.tmp';\"
                sqlite3 -bail /backups/.snapshot.tmp 'PRAGMA integrity_check;' > /backups/.integrity
              "

            # Asserted, not assumed -- the same shape as the seed preflight above. A backup step
            # that reported success without leaving a usable file is exactly the class of bug this
            # whole block is being rewritten for.
            if [ ! -s backups/.snapshot.tmp ]; then
              echo "FATAL: the pre-deploy snapshot is missing or empty." >&2
              echo "Nothing has been changed yet. Fix the snapshot before deploying." >&2
              exit 1
            fi
            if [ "$(cat backups/.integrity)" != "ok" ]; then
              echo "FATAL: the pre-deploy snapshot failed PRAGMA integrity_check:" >&2
              cat backups/.integrity >&2
              exit 1
            fi

            mv backups/.snapshot.tmp "$snapshot"
            rm -f backups/.integrity
            echo "snapshot ${snapshot} ($(wc -c < "$snapshot") bytes), integrity ok"
          fi
          ls -1t backups/ 2>/dev/null | tail -n +11 | while read -r old; do rm -f -- "backups/$old"; done

          # Pin the exact image, so a manual `docker compose up` on the box brings up what CI last
          # shipped rather than whatever :latest has become.
          sed -i "s|^REGSERVE_IMAGE=.*|REGSERVE_IMAGE=${image_ref}|" .env
          grep '^REGSERVE_IMAGE=' .env

          docker compose pull regserve
          docker compose up -d --remove-orphans regserve
          docker image prune -f --filter "until=168h"
          docker compose ps
          REMOTE

      - name: Verify the deployment is actually serving
        env:
          HOST_URL: https://${{ vars.REGSERVE_HOST }}
        run: |
          set -euo pipefail

          # EVERY check retries, not just the first one.
          #
          # What went wrong on the Phase 1 deploy (run 32193784028, attempt 1): /healthz had 30
          # attempts, /readyz and /index.json had one each. `docker compose up -d` recreates the
          # container, and for a moment afterwards Traefik has no server for this host — it drops
          # the router entirely and answers 404 on EVERY path, including one that answered 200 a
          # second earlier. The /healthz loop rode that window out because it retried. /readyz
          # landed in it, got a 404, and took the deploy red against a service that was already
          # serving correctly. The service was never broken; the check was.
          #
          # So the asymmetry was the defect: a check with no retry is not stricter than one with a
          # bounded retry, it is just noisier, and a pipeline that cries wolf gets re-run without
          # being read — which is exactly what happened.
          #
          # A retry is only honest if it is BOUNDED and the give-up is a hard failure. Nothing here
          # degrades to a warning: after the budget, the deploy is red.
          ATTEMPTS=30
          INTERVAL=5

          # attempt <description> <command...> — run until it succeeds or the budget is spent.
          #
          # `until` is used rather than `if !`, because `set -e` does not apply to a command in an
          # until/while condition; writing this with a plain `if` would abort the script on the
          # first failed try and defeat the retry it is supposed to implement.
          attempt() {
            local what="$1"; shift
            local i=1
            until "$@"; do
              if [ "$i" -ge "$ATTEMPTS" ]; then
                echo "FAILED: ${what} did not succeed in ${ATTEMPTS} attempts" >&2
                return 1
              fi
              i=$((i + 1))
              sleep "$INTERVAL"
            done
            echo "ok (attempt ${i}/${ATTEMPTS}): ${what}"
          }

          liveness() { curl -fsS --max-time 10 "${HOST_URL}/healthz" -o /dev/null; }

          # Readiness answers before the index is fetched because it says WHY when it is not ready:
          # a 503 whose body names the reason is a better first line in a failed deploy's log than
          # a curl exit code. The body is echoed for exactly that reason.
          readiness() {
            curl -fsS --max-time 15 "${HOST_URL}/readyz" -o /tmp/readyz.json || return 1
            cat /tmp/readyz.json
          }

          # The point of the whole service: the index must be servable AND parseable by the client
          # that is already installed. Fetch and assertion are one retryable unit — during the
          # routing window above a body can arrive truncated, and re-fetching is the right response
          # to that, whereas a permanently malformed index exhausts the budget and fails the deploy.
          index_serves() {
            curl -fsS --max-time 15 "${HOST_URL}/index.json" -o /tmp/index.json || return 1
            python3 -c "
          import json
          d=json.load(open('/tmp/index.json'))
          assert d['schema_version'] == 1, f\"schema_version is {d['schema_version']}, not 1\"
          assert isinstance(d['plugins'], list), 'plugins must be a list'
          print(f\"index ok: {len(d['plugins'])} plugin(s), schema_version={d['schema_version']}\")
          "
          }

          attempt "/healthz answers"                       liveness
          attempt "/readyz reports the catalogue is ready" readiness
          attempt "/index.json serves a schema-v1 index"   index_serves

          echo "deployment verified: liveness, readiness and a parseable schema-v1 index"
