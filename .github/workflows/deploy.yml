# Deploy to the DigitalOcean droplet.
#
# Split from release.yml on purpose: building an image is safe and automatic, applying it to the
# machine holding the only copy of the ownership records is neither. This workflow needs an
# environment approval on production and takes a snapshot before it swaps anything.
#
# What actually happens on the host is `docker compose pull && up -d`, against the compose file this
# workflow ships alongside the image. Traefik already owns :443 and picks the new container up from
# its labels, so there is no reverse-proxy step here.
#
# The split of what travels and what stays: the IMAGE and the COMPOSE FILE come from the release —
# from the SAME COMMIT, which is why this workflow checks out the triggering release rather than
# whatever the default branch has become while the deploy waited for approval. The `.env` stays on the
# droplet, because it holds secrets and a secret routed through a pipeline is a secret in that
# pipeline's logs, cache and every fork's pull-request context.
#
# The catalogue itself is NOT shipped by this workflow. Until the store lands (Phase 1) it is
# /opt/regserve/seed.json on the droplet, mounted into the container; this workflow asserts it is
# there before it touches anything.

name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 1.2.0, edge, sha-<full>)"
        required: true
        default: edge
      source_ref:
        description: >-
          Commit or tag the image was built from. The compose file is taken from here, so it must
          match image_tag: sha-<full> -> <full>, 1.2.0 -> v1.2.0. `edge` is built from the tip of
          main, which moves — prefer sha-<full> for anything you care about being reproducible.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  # Never deploy twice at once: two `compose up` runs against one SQLite volume is exactly the
  # situation the single-writer design assumes cannot happen.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy / production
    runs-on: ubuntu-24.04

    # Requires the `production` environment. Put a required reviewer on it in repo settings: that
    # is what makes a deploy a decision rather than a side effect of merging.
    environment:
      name: production
      url: https://${{ vars.REGSERVE_HOST }}

    # Do not deploy a build that failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # Resolved BEFORE the checkout, because it decides what the checkout takes.
      #
      # The image and the compose file must come from ONE commit. A deploy waits for a human on the
      # production environment, and `main` keeps moving while it waits — so checking out the default
      # branch would stage a compose file from a release this image was never built for. It would
      # not even look wrong: the run is green, the image is the pinned one, and the container comes
      # up with flags, mounts or required variables from somewhere else entirely.
      #
      # Values are passed through `env:` rather than interpolated into the script, so a crafted
      # dispatch input is data and never a line of shell.
      - name: Resolve the image and the commit it was built from
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_REF: ${{ github.event.inputs.source_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            # The release that triggered this run. One commit, both values.
            tag="sha-${RUN_SHA}"
            ref="$RUN_SHA"
          else
            tag="$INPUT_TAG"
            ref="$INPUT_REF"
          fi
          [ -n "$tag" ] || { echo "FATAL: image_tag is empty." >&2; exit 1; }
          [ -n "$ref" ] || { echo "FATAL: source_ref is empty." >&2; exit 1; }

          # Reject these values, do not encode them.
          #
          # $GITHUB_OUTPUT is a line-oriented `name=value` file, so a value containing a newline is
          # not an odd value — it is extra RECORDS. An image_tag of
          # "edge<newline>image=ghcr.io/attacker/evil:x" appends a second `image=` line, the LAST
          # one wins, and the deploy pulls and starts whatever it names, on production, past the
          # environment approval that was meant to be the control.
          #
          # The delimiter form would stop the injection and then hand `docker pull` a two-line image
          # reference instead, which is not an improvement. Neither of these is ever anything but a
          # plain token, so the honest answer is to refuse.
          #
          # `case`, not `grep`: grep is LINE-oriented, so `grep -E '^[A-Za-z0-9._-]+$'` matches the
          # first line of a multiline value and waves this exact attack through. A shell pattern
          # tests the whole string, newline included.
          case "$tag" in
            -* | *[!A-Za-z0-9._-]*)
              echo "FATAL: image_tag must be an OCI tag: letters, digits, '.', '_', '-'." >&2
              exit 1 ;;
          esac
          # `..` is not legal in a git ref, and a leading dash would be read as an option by the
          # commands these values reach.
          case "$ref" in
            -* | *..* | *[!A-Za-z0-9._/-]*)
              echo "FATAL: source_ref must be a commit sha, tag or branch name." >&2
              exit 1 ;;
          esac
          [ "${#tag}" -le 128 ] || { echo "FATAL: image_tag exceeds 128 characters." >&2; exit 1; }
          [ "${#ref}" -le 255 ] || { echo "FATAL: source_ref exceeds 255 characters." >&2; exit 1; }

          {
            echo "tag=${tag}"
            echo "source_ref=${ref}"
            echo "image=ghcr.io/${REPO}:${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "deploying ${tag} from ${ref}"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      # Prove the pairing where it is provable. A `sha-<full>` tag names its own commit, so a
      # mismatch here means the source ref was wrong and the compose file about to be shipped
      # belongs to a different release. A moving tag like `edge` cannot be checked, and this says so
      # rather than implying a guarantee it has not made.
      - name: Assert the compose file and the image come from one commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$TAG" in
            sha-*)
              want="${TAG#sha-}"
              if [ "$want" != "$head" ]; then
                echo "FATAL: image was built from ${want} but compose.yaml would come from ${head}." >&2
                echo "Re-run with source_ref=${want}." >&2
                exit 1
              fi
              echo "image and compose.yaml are both from ${head}"
              ;;
            *)
              echo "NOTE: ${TAG} is not a commit-derived tag, so the pairing cannot be verified."
              echo "compose.yaml comes from ${head}"
              ;;
          esac

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinned host key, NOT ssh-keyscan. Scanning at deploy time trusts whatever answers, which
      # means a deploy is the one moment an attacker gets a free man-in-the-middle.
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Staged as a separate file, not written over the live one. Nothing on the droplet changes
      # until the heredoc below has validated it against the host's real .env.
      - name: Stage the compose file
        env:
          HOST: ${{ vars.REGSERVE_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes deploy/compose.yaml \
            "${USER_NAME}@${HOST}:${DEPLOY_PATH}/compose.yaml.incoming"

      - name: Deploy
        env:
          # A repository VARIABLE, not a secret. The hostname is in deploy/env.example, in the
          # deployment runbook and in public DNS, so secrecy bought nothing — while the log
          # masking that comes with a secret turned "the name does not resolve" into
          # `ssh: Could not resolve hostname ***` and cost four failed deploys. One name is used
          # for SSH and for HTTPS, so this is also the string DEPLOY_KNOWN_HOSTS must be
          # keyscanned against. The credential and the host-key pin stay secrets.
          HOST: ${{ vars.REGSERVE_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          # QUOTED heredoc, and values cross the wire as positional arguments to `bash -s`.
          # An unquoted heredoc expands on the RUNNER, so a variable meant for the droplet gets
          # eaten by the runner's own `set -u` before the script is ever sent. That is not a
          # theoretical risk: it is what broke the first deploy, on `stamp`.
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            bash -seuo pipefail -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'REMOTE'
          deploy_path="$1"
          image_ref="$2"
          cd "$deploy_path"

          # Adopt the compose file that shipped with this release, BEFORE anything is pulled.
          #
          # It used to be hand-copied once at setup and never again, so a release could add a flag
          # the running stack never picked up. That is not hypothetical: the release that added
          # `--seed` would have started against a compose file that knew nothing about it, and the
          # container would have come up with no catalogue while /healthz reported "ok".
          if [ ! -s compose.yaml.incoming ]; then
            echo "FATAL: compose.yaml.incoming did not arrive; the staging step should have sent it." >&2
            exit 1
          fi

          # Validate the INCOMING file against this host's real .env. `config` resolves every
          # interpolation, so it fails here on a malformed compose file AND on any ${VAR:?} the .env
          # is missing — both of which would otherwise surface during `up -d`, with the old
          # container already stopped.
          docker compose -f compose.yaml.incoming --env-file .env config -q

          if [ -f compose.yaml ]; then
            cp compose.yaml compose.yaml.prev
          fi
          # `cat >`, not `mv`: writing through the existing file keeps its owner and mode, which a
          # rename from a scp-created file would silently replace.
          cat compose.yaml.incoming > compose.yaml
          rm -f compose.yaml.incoming
          echo "compose.yaml is the one that shipped with this release"

          # Preflight, BEFORE anything is pulled or swapped.
          #
          # The catalogue is a file placed by hand on this box (docs/operations/deployment.md), so
          # CI never sees it and cannot fail on it any earlier than this. The container is started
          # with --seed, which means a missing or empty file is a boot failure — and discovering
          # that after `compose up` means discovering it with the old container already gone. This
          # is the same argument as the snapshot below, one step further back.
          #
          # Non-empty is as far as a shell check honestly goes; whether the JSON parses is asserted
          # by the verify step at the end, and by the server itself refusing to start.
          if [ ! -s seed.json ]; then
            echo "FATAL: ${deploy_path}/seed.json is missing or empty." >&2
            echo "It is the catalogue this release serves. See docs/operations/deployment.md." >&2
            exit 1
          fi
          echo "seed.json present ($(wc -c < seed.json) bytes)"

          # Snapshot before anything changes. Migrations are forward-only (ADR-0006), so this file
          # is the only undo that exists. Taking it after the pull would be taking it after the
          # point of no return.
          mkdir -p backups
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if docker volume inspect regserve_regserve-data >/dev/null 2>&1; then
            docker run --rm \
              -v regserve_regserve-data:/data \
              -v "$PWD/backups:/backups" \
              alpine:3 sh -c 'cp /data/regserve.db "/backups/pre-'"$stamp"'.db" 2>/dev/null' \
              || echo "no database file yet; nothing to snapshot"
          else
            echo "no data volume yet; first deploy"
          fi
          ls -1t backups/ 2>/dev/null | tail -n +11 | while read -r old; do rm -f -- "backups/$old"; done

          # Pin the exact image, so a manual `docker compose up` on the box brings up what CI last
          # shipped rather than whatever :latest has become.
          sed -i "s|^REGSERVE_IMAGE=.*|REGSERVE_IMAGE=${image_ref}|" .env
          grep '^REGSERVE_IMAGE=' .env

          docker compose pull regserve
          docker compose up -d --remove-orphans regserve
          docker image prune -f --filter "until=168h"
          docker compose ps
          REMOTE

      - name: Verify the deployment is actually serving
        env:
          HOST_URL: https://${{ vars.REGSERVE_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "${HOST_URL}/healthz" >/dev/null; then
              echo "healthz is answering"
              break
            fi
            [ "$i" -eq 30 ] && { echo "healthz never came up"; exit 1; }
            sleep 5
          done

          # Readiness, which for now means "a catalogue is loaded and still renders". It answers
          # before /index.json is fetched because it says WHY when it is not ready, and a 503 with
          # a reason is a better first line in a failed deploy's log than a curl exit code.
          curl -fsS --max-time 15 "${HOST_URL}/readyz"

          # The point of the whole service: the index must be servable and parseable. A deploy that
          # boots but serves a broken index is a deploy that took every client's plugin browser
          # down, so this failing is a real failure.
          curl -fsS --max-time 15 "${HOST_URL}/index.json" -o /tmp/index.json
          python3 -c "
          import json,sys
          d=json.load(open('/tmp/index.json'))
          assert d['schema_version'] == 1, f\"schema_version is {d['schema_version']}, not 1\"
          assert isinstance(d['plugins'], list), 'plugins must be a list'
          print(f\"index ok: {len(d['plugins'])} plugin(s), schema_version={d['schema_version']}\")
          "
