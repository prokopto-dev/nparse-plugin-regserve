# Build and publish the container image.
#
# Runs on a tag, and on every push to main so that `:edge` always exists to deploy. The image is the
# only artefact CI produces; it carries no secrets, which is what makes it safe to publish.
#
# Actions are pinned to 40-character SHAs (gate PIN001). A tag is mutable — pinning to one means
# trusting whoever can move it, on a workflow that holds a package-write token.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate MIG004, at the only moment it can fire.
  #
  # A `v*` tag is what makes a migration "shipped": from here on it has run against the only copy
  # of the ownership records, and editing it changes what a FRESH database gets while changing
  # nothing about production — the two then diverge with nothing to notice, because migrations are
  # forward-only and there is no down path that would. db/SHIPPED.lock is what freezes them and
  # MIG003 is what compares them, but MIG003 can only check what somebody listed. Nothing listed
  # anything (issue #14), so this refuses to build the image for a tag that would ship a migration
  # the lock file has never seen.
  #
  # It runs on every push too, where it is a no-op, so the job is not one that only ever executes
  # under the conditions nobody tests.
  migrations-frozen:
    name: gate / migrations frozen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Every migration this tag ships is frozen in db/SHIPPED.lock
        if: github.ref_type == 'tag'
        run: bash scripts/freeze-migrations.sh --check

      - name: Not a release
        if: github.ref_type != 'tag'
        run: echo "not a tagged release; migrations stay editable until one is cut"

  image:
    name: build / image
    needs: [migrations-frozen]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The build stamps main.buildDate. Using the COMMIT date rather than "now" makes two builds
      # of the same commit byte-identical, which is what lets you prove a running image matches a
      # source tree.
      - name: Resolve build metadata
        id: vars
        run: |
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="0.0.0-edge+${GITHUB_SHA::7}"
          # Filter the version before it reaches -ldflags: a tag is attacker-influenced input on a
          # public repo, and -X takes whatever it is given.
          echo "version=$(printf '%s' "$version" | tr -cd 'A-Za-z0-9.+_-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          # arm64 is here because a DigitalOcean droplet may well be one, and finding that out at
          # deploy time is a bad evening.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.date }}

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
