# Migrations that have shipped in a TAGGED RELEASE, frozen by sha256. Gate MIG003 compares each
# line against the file on disk and fails the build when one has changed.
#
# Why: a shipped migration has already run against the only copy of the ownership records. Editing
# it changes what a FRESH database gets and nothing about the one in production, so the two diverge
# with nothing to notice — and migrations are forward-only, so there is no down path that would.
#
# THERE ARE NO ENTRIES YET, because no release has been tagged. Everything in
# db/migrations-sqlite/ is still editable, and MIG003 reports itself vacant rather than passing.
#
# Freeze what a release ships BEFORE tagging it:
#
#     make freeze-migrations
#     git add db/SHIPPED.lock && git commit -s -m 'chore(db): freeze shipped migrations'
#     git tag -s vX.Y.Z
#
# That order is not advice. Gate MIG004 refuses to build a release image for a `v*` tag whose
# migrations are not listed here, so a release that skipped the freeze fails instead of shipping
# with MIG003 comparing nothing. Previously this file documented the one-liner
# `shasum -a 256 db/migrations-sqlite/*.sql >> db/SHIPPED.lock` and nothing ran it — a rule whose
# mechanism is "somebody remembers on release day" (issue #14).
#
# The format is one `<sha256>  <path>` line per file, which is what shasum already writes, so a
# hand-appended line and a generated one are the same thing. Lines starting with # are ignored.
