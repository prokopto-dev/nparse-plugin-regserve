<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!--
  THIS FILE MUST BEGIN WITH THE <svg> TAG, which is why this comment reads
  out of order — it sits INSIDE the element rather than above it.

  gdk-pixbuf sniffs an image's format from the first bytes of the file, and
  librsvg's loader registers exactly two signatures: "<svg" and "<!DOCTYPE
  svg". A leading comment matches neither, so the file comes back as
  "Unrecognized image file format" even though it is perfectly valid SVG that
  Qt, every browser and every editor render fine. An XML declaration first
  fails the same way, so moving <?xml?> to the top is NOT the escape hatch.

  That matters because the Flatpak manifest installs this file into
  hicolor/scalable/, and flatpak-builder runs `appstreamcli compose` over the
  export — which reads the scalable icon and treats a read error as fatal.
  With the comment on top it killed the whole build-linux job, and with it
  the release: v2.9.0 was tagged and never shipped.

  nParse+ application mark — the source of truth for every shipped icon.

  Replaces data/assets/icon.xcf, which was 64x64 raster art inherited from the
  nParse fork (a black-on-white "n") and could not be diffed or resampled.
  Everything rasterized from this file is generated by tools/gen_icons.py; do
  not hand-edit the PNG/ICO/ICNS outputs.

  THE MARK: an angular lowercase "n" — a rune cut from straight lines, no
  curve anywhere — inside a ring, engraved gold on black glass, seated on a
  notched Velious plate.

  Every colour below is a real value from src/nparseplus/ui/skins.py, so the
  icon belongs on the same shelf as the `velious` skin ("beveled stone frame,
  notched corners, engraved gold"):

      #6b5a3a   VELIOUS.glass_border / plate_border
      #3a3122 -> #241e14   VELIOUS.plate
      #0a0b0f -> #06070a   VELIOUS.glass (opaque; the icon has no window behind it)
      #e2c882   VELIOUS.mark_color — the brightest gold in the app
      #c8a951   DUXA.mark_color
      #8a7549   LEDGER.title_color — the muted gold, used as the gradient's foot

  GEOMETRY, and why it is what it is. The whole design is tuned so the 16px
  raster keeps a clean silhouette; that is the icon's only hard requirement,
  since a taskbar is where it is read.

  - The tile is an octagon, not a rounded square: the corner notch is the
    Velious skin's `notch` motif (its own value is 9px at window scale). Cut
    at 34/256 it survives to ~2px at 16px, which is enough to register.
  - Three concentric octagons make the bevel. Each band is 11 units — about
    0.7px at 16px — so together they read as one 1.4px frame rather than
    three separate lines that would alias into mud.
  - The ring is r=78 with a 16-unit stroke (1px at 16px), leaving 17 units of
    glass outside it so the ring never touches the frame.
  - The glyph's stroke is 21 units (1.3px at 16px) — deliberately heavier
    than the ring, so the "n" stays the thing you see first as the raster
    shrinks and the ring becomes its frame.
  - The shoulders rise at exactly 45 degrees, and the apex is a miter join:
    its point reaches r=59, comfortably clear of the ring's inner edge at
    r=70. Butt caps and miter joins throughout — a round cap would put a
    curve back into a glyph whose whole idea is that it has none.

  Rejected on evidence, recorded so nobody re-proposes them (see issue #104):
  - Nauthiz (the actual Elder Futhark n-rune, a stave crossed by one
    diagonal) is unusable here: a diagonal through a ring is the universal
    prohibition sign, and it reads as "no entry" at every size.
  - A "+" set into the ring for the "plus" in nParse+ is a two-pixel smudge
    at 16px, and breaking the ring to seat it costs more than it adds. The
    "+" lives in the wordmark lockup instead, where it has room.
-->
  <title>nParse+</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3122"/>
      <stop offset="1" stop-color="#241e14"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#06070a"/>
    </linearGradient>
    <!-- Lights the engraving from above: bright crown, muted foot. -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c882"/>
      <stop offset="0.55" stop-color="#c8a951"/>
      <stop offset="1" stop-color="#8a7549"/>
    </linearGradient>
  </defs>

  <!-- Bevel: border, plate, glass. Each inner octagon is inset 11 units, its
       notch shortened by 11*(sqrt(2)-1) so the band stays an even width. -->
  <path d="M34,0 L222,0 L256,34 L256,222 L222,256 L34,256 L0,222 L0,34 Z" fill="#6b5a3a"/>
  <path d="M40,11 L216,11 L245,40 L245,216 L216,245 L40,245 L11,216 L11,40 Z" fill="url(#plate)"/>
  <path d="M47,22 L209,22 L234,47 L234,209 L209,234 L47,234 L22,209 L22,47 Z" fill="url(#glass)"/>

  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#gold)" stroke-width="16"/>

  <!-- The angular n: stem, 45-degree shoulder to the apex, mirrored down. -->
  <path d="M96,182 L96,116 L128,84 L160,116 L160,182"
        fill="none" stroke="url(#gold)" stroke-width="21"
        stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
