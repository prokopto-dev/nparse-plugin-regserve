{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — nParse+ plugin registry</title>
<style>
  :root { color-scheme: light dark; --fg: #16161d; --bg: #fbfbfd; --muted: #5b5b6b;
          --line: #d8d8e0; --accent: #2f5fd0; --warn: #8a4b00; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8ef; --bg: #14141a; --muted: #9a9aab; --line: #2e2e3a;
            --accent: #8fb0ff; --warn: #e0a45c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 1rem 4rem; color: var(--fg); background: var(--bg);
         font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main, header { max-width: 52rem; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
           padding: 1.25rem 0; border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 2.5rem 0 .75rem; }
  a { color: var(--accent); }
  p, li { max-width: 42rem; }
  .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin: .5rem 0 1rem; }
  th, td { text-align: left; padding: .5rem .5rem .5rem 0; border-bottom: 1px solid var(--line);
           vertical-align: top; font-size: .95rem; }
  th { font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase;
       letter-spacing: .04em; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  form { margin: 1rem 0; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 1rem; margin: 0 0 1rem; }
  legend { padding: 0 .4rem; font-weight: 600; font-size: .9rem; }
  label { display: block; margin: .6rem 0 .2rem; font-size: .9rem; }
  input[type=text], select { padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 4px;
         background: var(--bg); color: var(--fg); min-width: 18rem; max-width: 100%; }
  button { padding: .45rem .9rem; border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
           background: var(--fg); color: var(--bg); font: inherit; font-size: .9rem; }
  button.link { background: none; color: var(--accent); border-color: transparent;
                padding: .1rem .2rem; text-decoration: underline; }
  .notice { border: 1px solid var(--line); border-left: 4px solid var(--accent);
            padding: .75rem 1rem; border-radius: 4px; margin: 1rem 0; }
  .notice.problem { border-left-color: var(--warn); }
  .secret { display: block; padding: .75rem; margin: .5rem 0; border: 1px dashed var(--line);
            border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="color:inherit;text-decoration:none">nParse+ plugin registry</a></h1>
  {{if .Account}}
    <span class="muted">
      {{.Account.DisplayName}}
      <form method="post" action="/auth/logout" style="display:inline;margin:0">
        <input type="hidden" name="{{.CSRFField}}" value="{{.CSRFToken}}">
        <button type="submit" class="link">sign out</button>
      </form>
    </span>
  {{end}}
</header>
<main>
{{if .Problem}}<div class="notice problem">{{.Problem}}</div>{{end}}
{{if .Notice}}<div class="notice">{{.Notice}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
