# The unit of deployment on the droplet.
#
# Traefik is already running and owns :80/:443 and TLS. This file adds one service to the network
# Traefik watches and describes the route with labels; it publishes NO ports of its own, so the
# only way in is through Traefik.
#
# Copy this to the droplet (see docs/operations/deployment.md), put the secrets in a sibling .env,
# and never commit that .env.

name: regserve

services:
  regserve:
    image: ${REGSERVE_IMAGE:-ghcr.io/prokopto-dev/nparse-plugin-regserve:latest}
    restart: unless-stopped

    # No `ports:`. Publishing one would expose the service on the droplet's public IP directly,
    # bypassing Traefik and its TLS — which is the sort of thing nobody notices until it is found.
    expose:
      - "8080"

    # The image's own CMD has no --seed, so without this the container comes up, answers /healthz
    # with "ok", and 404s the one document it exists to serve. Until the store lands (Phase 1) the
    # catalogue IS this file.
    command: ["serve", "--addr", ":8080", "--seed", "/etc/regserve/seed.json"]

    environment:
      # CONSUMED TODAY: only REGSERVE_LOG_LEVEL. The rest are declared for the phases that read
      # them — DB_PATH and PUBLIC_URL in Phase 1, the pepper and the OAuth pairs in Phase 2 — and
      # setting one now changes nothing. They are listed rather than added later so the .env on the
      # droplet is complete before the release that needs it, and marked rather than left looking
      # active because a variable that reads as configuration and is ignored is its own defect.
      REGSERVE_DB_PATH: /data/regserve.db
      REGSERVE_PUBLIC_URL: https://${REGSERVE_HOST:?set REGSERVE_HOST in .env}
      REGSERVE_LOG_LEVEL: ${REGSERVE_LOG_LEVEL:-info}

      # Secrets, all Phase 2. These live in .env on the droplet and are deliberately NOT passed
      # through CI: a secret that travels through a pipeline is a secret in that pipeline's logs,
      # cache and every fork's pull-request context. CI ships an image; the host holds the
      # credentials. The pepper is required by `${VAR:?}` even though nothing reads it yet, so that
      # it is generated once, early, rather than under pressure on the day publishing turns on.
      REGSERVE_TOKEN_PEPPER: ${REGSERVE_TOKEN_PEPPER:?set REGSERVE_TOKEN_PEPPER in .env}
      REGSERVE_GITHUB_CLIENT_ID: ${REGSERVE_GITHUB_CLIENT_ID:-}
      REGSERVE_GITHUB_CLIENT_SECRET: ${REGSERVE_GITHUB_CLIENT_SECRET:-}
      REGSERVE_DISCORD_CLIENT_ID: ${REGSERVE_DISCORD_CLIENT_ID:-}
      REGSERVE_DISCORD_CLIENT_SECRET: ${REGSERVE_DISCORD_CLIENT_SECRET:-}
      REGSERVE_GOOGLE_CLIENT_ID: ${REGSERVE_GOOGLE_CLIENT_ID:-}
      REGSERVE_GOOGLE_CLIENT_SECRET: ${REGSERVE_GOOGLE_CLIENT_SECRET:-}

    volumes:
      - regserve-data:/data

      # The catalogue, placed by hand on the droplet (docs/operations/deployment.md). Read-only,
      # and compatible with read_only: true below — that flag makes the container's own root
      # filesystem immutable and says nothing about separate mounts.
      #
      # It must be world-readable (chmod 644): the container runs as uid 65532, which will not
      # match whoever owns the file on the host.
      #
      # Long syntax for one reason: create_host_path: false. The default is to CREATE a directory
      # at a missing source, which would mount a directory over the seed and kill the server at
      # boot with "read seed file: is a directory" — a confusing message for a simple mistake, and
      # a crash-loop rather than a refusal. This makes `compose up` fail on the missing file
      # instead. The deploy workflow checks it earlier still; this covers a hand-run on the box.
      - type: bind
        source: ./seed.json
        target: /etc/regserve/seed.json
        read_only: true
        bind:
          create_host_path: false

    # The image runs as uid 65532 and the named volume is chown-ed on first creation. If you switch
    # to a bind mount, chown it to 65532:65532 first or the first boot fails on an unwritable /data.
    user: "65532:65532"

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # read_only makes / immutable, and SQLite needs scratch space for its rollback journal and
      # for any query that spills to disk. Without this a write fails at runtime rather than at
      # boot, which is the worst time to discover it.
      - /tmp:size=64m
    cap_drop:
      - ALL

    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}

      # Two routers, matching the pattern already working for the other services on this droplet:
      # a plain-HTTP router that only redirects, and a `-secure` router that terminates TLS.
      #
      # The entrypoint and certresolver NAMES are whatever the Traefik static config calls them —
      # they are not standard. On this droplet they are `http`/`https` and a resolver named `http`.
      # Naming a resolver that does not exist is silent: Traefik routes the host fine and simply
      # never obtains a certificate, so it presents its self-signed default and every client sees a
      # TLS error rather than anything pointing at the real cause.
      traefik.http.routers.regserve.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTP:-http}
      traefik.http.routers.regserve.rule: Host(`${REGSERVE_HOST}`)
      traefik.http.middlewares.regserve-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.regserve.middlewares: regserve-https-redirect

      traefik.http.routers.regserve-secure.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTPS:-https}
      traefik.http.routers.regserve-secure.rule: Host(`${REGSERVE_HOST}`)
      traefik.http.routers.regserve-secure.tls: "true"
      traefik.http.routers.regserve-secure.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-http}
      traefik.http.routers.regserve-secure.service: regserve
      traefik.http.routers.regserve-secure.middlewares: regserve-hsts

      traefik.http.services.regserve.loadbalancer.server.port: "8080"

      # Traefik's own health view. Without it a failed deploy keeps receiving traffic until
      # somebody notices the 502s.
      traefik.http.services.regserve.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.regserve.loadbalancer.healthcheck.interval: "30s"

      # HSTS on the secure router only. Sending it over plain HTTP is meaningless and, on a shared
      # parent domain, includeSubDomains from the wrong place can lock siblings out of http.
      traefik.http.middlewares.regserve-hsts.headers.stsSeconds: "31536000"

      # Watchtower, if you run it, must NOT touch this service: an unattended image swap can apply
      # a forward-only migration to the only copy of the ownership records with nobody watching and
      # no snapshot taken. Deploys are deliberate here (.github/workflows/deploy.yml).
      com.centurylinklabs.watchtower.enable: "false"

    networks:
      - proxy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  regserve-data:

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
